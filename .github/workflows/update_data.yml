name: Update Data

on:
  schedule:
    - cron: "0 15 * * *"  # JST 0:00 (UTC 15:00)
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (e.g. 2025)"
        required: false
        default: "2025"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: Fetch data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          SEASON="${{ github.event.inputs.season || '2025' }}"
          uv run python scripts/fetch_all.py --season "$SEASON"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update data $(date -u '+%Y-%m-%d')"
          git push
